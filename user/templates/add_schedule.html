<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>일정</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            padding: 20px;
            background: #fafafa;
        }

        h2 {
            margin-bottom: 20px;
        }

        /* 일정 카드 */
        .schedule-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* floating 버튼 */
        .floating-btn {
            position: fixed;
            right: 20px;
            bottom: 80px;
            padding: 12px 16px;
            background: #4CAF50;
            color: white;
            border-radius: 25px;
            text-decoration: none;
            font-size: 14px;
        }

        /* 요청 개수 */
        .badge {
            background: red;
            border-radius: 50%;
            padding: 3px 7px;
            margin-left: 5px;
        }

        /* 하단 바 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }

        .bottom-nav a {
            text-decoration: none;
            color: #333;
            font-size: 14px;
        }
    </style>
</head>

<body>

<h2>📅 내 일정</h2>

<!-- 일정 목록 (지금은 테스트용) -->
<div class="schedule-box">
    일정 없음
</div>


<!-- 📨 일정 요청 버튼 -->
<a href="/schedule-requests/" class="floating-btn">
    📨 일정 요청
    {% if request_count > 0 %}
        <span class="badge">{{ request_count }}</span>
    {% endif %}
</a>


<!-- 하단 네비 -->
<div class="bottom-nav">
    <a href="/friends/">👥 친구</a>
    <a href="/add/">📅 일정</a>
</div>

</body>
</html>
