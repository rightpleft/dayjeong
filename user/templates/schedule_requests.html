<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>받은 일정 요청</title>

<style>
body {
    font-family: Arial;
    padding: 20px;
    background: #f5f6fa;
}

/* 상단 */
.top-bar {
    margin-bottom: 20px;
}

/* 요청 카드 */
.req {
    background: white;
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* 정보 */
.info {
    font-weight: bold;
}

/* 버튼 영역 */
.actions a {
    text-decoration: none;
    padding: 6px 10px;
    border-radius: 5px;
    font-size: 12px;
    margin-left: 5px;
}

/* 버튼 스타일 */
.accept {
    background: #4CAF50;
    color: white;
}

.reject {
    background: #f44336;
    color: white;
}

.actions a:hover {
    opacity: 0.8;
}

/* 🔥 우측 하단 버튼 */
.floating-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #4CAF50;
    color: white;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    text-decoration: none;
    font-size: 22px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.floating-btn:hover {
    background: #45a049;
}
</style>
</head>

<body>

<!-- 🔙 상단 -->
<div class="top-bar">
    <a href="/add/">📅 일정목록으로</a>
</div>

<h2>📬 받은 일정 요청</h2>

<!-- 📋 요청 리스트 -->
{% for r in requests %}
    <div class="req">
        <span class="info">
            {{ r.from_user.username }} - {{ r.date }}
        </span>

        <div class="actions">
            <!-- ✅ 반드시 이 URL -->
            <a href="/accept-schedule/{{ r.id }}/"
               class="accept"
               onclick="return confirm('수락하시겠습니까?')">O</a>

            <a href="/reject-schedule/{{ r.id }}/"
               class="reject"
               onclick="return confirm('거절하시겠습니까?')">X</a>
        </div>
    </div>
{% empty %}
    <p>받은 요청 없음</p>
{% endfor %}

<!-- 🔥 우측 하단: 보낸 요청 버튼 -->
<a href="/sent-requests/" class="floating-btn">
    📤
</a>

</body>
</html>
