<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>일정 요청</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #fafafa;
        }

        .top-bar {
            margin-bottom: 20px;
        }

        .req {
            background: white;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-group {
            display: flex;
            gap: 5px;
        }

        .ok-btn {
            background: green;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .no-btn {
            background: red;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        /* 📤 보낸 요청 버튼 (우측 하단) */
        .floating-btn {
            position: fixed;
            right: 20px;
            bottom: 80px;
            padding: 12px 16px;
            background: #2196F3;
            color: white;
            border-radius: 25px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<!-- 🔙 상단 -->
<div class="top-bar">
    <a href="/add/">📅 일정목록으로</a>
</div>

<h2>📨 받은 일정 요청</h2>

{% for r in requests %}
    <div class="req">
        <span>{{ r.from_user.username }} - {{ r.date }}</span>

        <div class="btn-group">
            <!-- ✅ 수락 -->
            <a href="/accept-request/{{ r.id }}/"
                class="ok-btn"
                onclick="return confirm('이 요청을 수락하시겠습니까?')">
                O
            </a>

            <!-- ❌ 거절 -->
            <a href="/reject-request/{{ r.id }}/"
               class="no-btn"
               onclick="return confirm('이 요청을 거절하시겠습니까?')">
               X
            </a>
        </div>
    </div>
{% empty %}
    <p>요청 없음</p>
{% endfor %}

<!-- 📤 보낸 요청 버튼 -->
<a href="/sent-requests/" class="floating-btn">
    📤 보낸 요청
</a>

</body>
</html>
