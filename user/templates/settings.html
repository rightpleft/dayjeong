<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DayJeong - 설정</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f7f9f7;
    color: #222;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Pretendard",
        sans-serif;

    padding-bottom: 90px;
}

.app {
    width: 100%;
    max-width: 480px;

    margin: 0 auto;
    padding: 24px 18px 30px;
}


/* 상단 */

.header {
    margin-bottom: 24px;
}

.page-title {
    margin: 0;

    font-size: 27px;
    font-weight: 900;
    letter-spacing: -1px;
}

.page-description {
    margin-top: 6px;

    color: #939894;
    font-size: 13px;
}


/* 프로필 */

.profile-card {
    display: flex;
    align-items: center;

    gap: 15px;

    background: white;

    padding: 20px;

    border-radius: 24px;

    margin-bottom: 18px;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.04);
}

.profile-avatar {
    width: 58px;
    height: 58px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 20px;

    background: #e5f5e7;
    color: #4b9d57;

    font-size: 24px;
    font-weight: 900;
}

.profile-name {
    font-size: 17px;
    font-weight: 900;
}

.profile-sub {
    margin-top: 4px;

    color: #999;
    font-size: 12px;
}


/* 메뉴 */

.settings-card {
    background: white;

    border-radius: 24px;

    overflow: hidden;

    margin-bottom: 16px;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.035);
}

.settings-title {
    padding: 18px 18px 8px;

    color: #999;

    font-size: 11px;
    font-weight: 800;
}

.setting-item {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 16px 18px;

    color: #222;
    text-decoration: none;

    border-bottom: 1px solid #f1f2f1;
}

.setting-item:last-child {
    border-bottom: none;
}

.setting-left {
    display: flex;
    align-items: center;

    gap: 12px;
}

.setting-icon {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 12px;

    background: #f1f7f2;

    font-size: 18px;
}

.setting-name {
    font-size: 14px;
    font-weight: 800;
}

.setting-sub {
    margin-top: 3px;

    color: #999;
    font-size: 10px;
}

.setting-arrow {
    color: #bbb;
    font-size: 19px;
}


/* 로그아웃 */

.logout-btn {
    display: block;

    width: 100%;

    margin-top: 20px;

    padding: 15px;

    border: none;
    border-radius: 16px;

    background: #fff0ef;
    color: #d4544f;

    text-align: center;
    text-decoration: none;

    font-size: 14px;
    font-weight: 900;
}


/* 버전 */

.version {
    margin-top: 18px;

    text-align: center;

    color: #bbb;

    font-size: 10px;
}


/* 하단 네비 */

.bottom-nav {
    position: fixed;

    left: 50%;
    bottom: 0;

    transform: translateX(-50%);

    width: 100%;
    max-width: 480px;

    display: grid;
    grid-template-columns: repeat(4, 1fr);

    background: rgba(255,255,255,0.97);

    border-top: 1px solid #eceeec;

    padding: 9px 0 12px;

    z-index: 100;
}

.nav-item {
    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 3px;

    color: #9b9f9c;

    text-decoration: none;

    font-size: 10px;
}

.nav-icon {
    font-size: 21px;
}

.nav-item.active {
    color: #59ae65;
    font-weight: 800;
}
</style>
</head>


<body>

<div class="app">

    <!-- 상단 -->
    <header class="header">

        <h1 class="page-title">
            설정
        </h1>

        <div class="page-description">
            DayJeong 계정과 서비스 설정을 관리하세요.
        </div>

    </header>


    <!-- 프로필 -->
    <section class="profile-card">

        <div class="profile-avatar">
            {{ request.user.username|slice:":1"|upper }}
        </div>

        <div>

            <div class="profile-name">
                {{ request.user.username }}
            </div>

            <div class="profile-sub">
                DayJeong 계정
            </div>

        </div>

    </section>


    <!-- 계정 -->
    <section class="settings-card">

        <div class="settings-title">
            계정
        </div>

        <div class="setting-item">

            <div class="setting-left">

                <div class="setting-icon">
                    👤
                </div>

                <div>

                    <div class="setting-name">
                        내 프로필
                    </div>

                    <div class="setting-sub">
                        사용자 정보 확인
                    </div>

                </div>

            </div>

            <div class="setting-arrow">
                ›
            </div>

        </div>


        <a href="/friends/" class="setting-item">

            <div class="setting-left">

                <div class="setting-icon">
                    👥
                </div>

                <div>

                    <div class="setting-name">
                        친구 관리
                    </div>

                    <div class="setting-sub">
                        친구와 친구 요청 관리
                    </div>

                </div>

            </div>

            <div class="setting-arrow">
                ›
            </div>

        </a>

    </section>


    <!-- 서비스 -->
    <section class="settings-card">

        <div class="settings-title">
            서비스
        </div>

        <a
            href="mailto:dayjeong.app@gmail.com"
            class="setting-item"
        >

            <div class="setting-left">

                <div class="setting-icon">
                    ✉️
                </div>

                <div>

                    <div class="setting-name">
                        이메일 문의
                    </div>

                    <div class="setting-sub">
                        dayjeong.app@gmail.com
                    </div>

                </div>

            </div>

            <div class="setting-arrow">
                ›
            </div>

        </a>


        <a
            href="https://www.instagram.com/dayjeong.app/"
            target="_blank"
            class="setting-item"
        >

            <div class="setting-left">

                <div class="setting-icon">
                    📷
                </div>

                <div>

                    <div class="setting-name">
                        Instagram
                    </div>

                    <div class="setting-sub">
                        @dayjeong.app
                    </div>

                </div>

            </div>

            <div class="setting-arrow">
                ›
            </div>

        </a>


        <a
            href="https://pf.kakao.com/_wktuX"
            target="_blank"
            class="setting-item"
        >

            <div class="setting-left">

                <div class="setting-icon">
                    💬
                </div>

                <div>

                    <div class="setting-name">
                        KakaoTalk
                    </div>

                    <div class="setting-sub">
                        데이정(DayJeong)
                    </div>

                </div>

            </div>

            <div class="setting-arrow">
                ›
            </div>

        </a>

    </section>


    <!-- 로그아웃 -->
    <a
        href="/logout/"
        class="logout-btn"
    >
        로그아웃
    </a>


    <div class="version">
        DayJeong
    </div>

</div>


<!-- 하단 네비 -->
<nav class="bottom-nav">

    <a href="/" class="nav-item">
        <span class="nav-icon">⌂</span>
        홈
    </a>

    <a href="/add/" class="nav-item">
        <span class="nav-icon">▣</span>
        일정
    </a>

    <a href="/friends/" class="nav-item">
        <span class="nav-icon">♟</span>
        친구
    </a>

    <a href="/settings/" class="nav-item active">
        <span class="nav-icon">⚙</span>
        설정
    </a>

</nav>

</body>
</html>
