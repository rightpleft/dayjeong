<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DayJeong - 친구</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f7f9f7;
    color: #222;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Pretendard",
        sans-serif;

    padding-bottom: 90px;
}

.app {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 18px 30px;
}


/* =========================
   상단
========================= */

.header {
    margin-bottom: 26px;
}

.page-title {
    margin: 0;
    font-size: 27px;
    font-weight: 900;
    letter-spacing: -1px;
}

.page-description {
    margin-top: 6px;
    color: #939894;
    font-size: 13px;
}


/* =========================
   친구 추가 카드
========================= */

.add-card {
    background: white;
    border-radius: 24px;
    padding: 20px;
    margin-bottom: 14px;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.04);
}

.section-title {
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 6px;
}

.section-description {
    font-size: 12px;
    color: #999;
    margin-bottom: 16px;
}

.search-box {
    display: flex;
    gap: 8px;
}

.search-box input {
    flex: 1;
    min-width: 0;

    padding: 14px 15px;

    border: 1px solid #e4e7e4;
    border-radius: 15px;

    background: #fafbfa;

    font-size: 14px;
    outline: none;
}

.search-box input:focus {
    border-color: #70c27b;
    background: white;
}

.search-box button {
    padding: 0 18px;

    border: none;
    border-radius: 15px;

    background: #68bd73;
    color: white;

    font-size: 13px;
    font-weight: 800;

    cursor: pointer;
}

.search-box button:active {
    transform: scale(0.97);
}


/* =========================
   받은 친구 요청
========================= */

.request-card {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 17px 19px;
    margin-bottom: 22px;

    background: #edf7ee;
    border-radius: 19px;

    text-decoration: none;
    color: #222;
}

.request-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.request-icon {
    width: 40px;
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 13px;

    background: white;
    font-size: 19px;
}

.request-title {
    font-size: 14px;
    font-weight: 800;
}

.request-sub {
    margin-top: 3px;
    font-size: 11px;
    color: #849087;
}

.request-arrow {
    color: #69a572;
    font-size: 20px;
}


/* =========================
   친구 목록
========================= */

.list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 12px;
}

.list-title {
    font-size: 17px;
    font-weight: 900;
}

.friend-count {
    font-size: 12px;
    color: #999;
}

.friend-card {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 15px;

    background: white;
    border-radius: 19px;

    margin-bottom: 10px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.035);
}

.friend-info {
    display: flex;
    align-items: center;
    gap: 12px;

    min-width: 0;
}

.friend-avatar {
    width: 46px;
    height: 46px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 16px;

    background: #e7f5e9;
    color: #4b9d57;

    font-size: 20px;
    font-weight: 800;
}

.friend-text {
    min-width: 0;
}

.friend-name {
    font-size: 14px;
    font-weight: 800;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.friend-sub {
    margin-top: 3px;

    color: #9b9f9c;
    font-size: 11px;
}

.view-btn {
    flex-shrink: 0;

    padding: 9px 13px;

    border-radius: 12px;

    background: #eff7f0;
    color: #52965c;

    text-decoration: none;

    font-size: 12px;
    font-weight: 800;
}

.view-btn:active {
    transform: scale(0.96);
}


/* =========================
   친구 없음
========================= */

.empty-card {
    padding: 35px 20px;

    background: white;
    border-radius: 22px;

    text-align: center;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.03);
}

.empty-icon {
    font-size: 35px;
    margin-bottom: 10px;
}

.empty-title {
    font-size: 14px;
    font-weight: 800;
}

.empty-sub {
    margin-top: 5px;

    color: #999;
    font-size: 11px;
}


/* =========================
   하단 네비
========================= */

.bottom-nav {
    position: fixed;

    left: 50%;
    bottom: 0;

    transform: translateX(-50%);

    width: 100%;
    max-width: 480px;

    display: grid;
    grid-template-columns: repeat(4, 1fr);

    background: rgba(255,255,255,0.97);

    border-top: 1px solid #eceeec;

    padding: 9px 0 12px;

    z-index: 100;
}

.nav-item {
    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 3px;

    color: #9b9f9c;

    text-decoration: none;

    font-size: 10px;
}

.nav-icon {
    font-size: 21px;
}

.nav-item.active {
    color: #59ae65;
    font-weight: 800;
}
</style>
</head>


<body>

<div class="app">

    <!-- 상단 -->
    <header class="header">

        <h1 class="page-title">
            친구
        </h1>

        <div class="page-description">
            친구와 일정을 공유하고 서로의 캘린더를 확인해보세요.
        </div>

    </header>


    <!-- 친구 추가 -->
    <section class="add-card">

        <div class="section-title">
            친구 추가
        </div>

        <div class="section-description">
            친구의 아이디를 입력해서 요청을 보내세요.
        </div>

        <form
            method="POST"
            action="/send-request/"
            class="search-box"
        >

            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="친구 아이디"
                autocomplete="off"
                required
            >

            <button type="submit">
                요청
            </button>

        </form>

    </section>


    <!-- 받은 친구 요청 -->
    <a href="/requests/" class="request-card">

        <div class="request-left">

            <div class="request-icon">
                💌
            </div>

            <div>

                <div class="request-title">
                    받은 친구 요청
                </div>

                <div class="request-sub">
                    새 요청을 확인하고 수락할 수 있어요.
                </div>

            </div>

        </div>

        <div class="request-arrow">
            ›
        </div>

    </a>


    <!-- 친구 목록 -->
    <div class="list-header">

        <div class="list-title">
            내 친구
        </div>

    </div>


    {% for f in friends %}

        <div class="friend-card">

            <div class="friend-info">

                <div class="friend-avatar">
                    {{ f.username|slice:":1"|upper }}
                </div>

                <div class="friend-text">

                    <div class="friend-name">
                        {{ f.username }}
                    </div>

                    <div class="friend-sub">
                        캘린더 확인 가능
                    </div>

                </div>

            </div>


            <a
                href="/friend/{{ f.id }}/"
                class="view-btn"
            >
                캘린더
            </a>

        </div>

    {% empty %}

        <div class="empty-card">

            <div class="empty-icon">
                👥
            </div>

            <div class="empty-title">
                아직 친구가 없어요
            </div>

            <div class="empty-sub">
                위에서 아이디를 검색해 친구 요청을 보내보세요.
            </div>

        </div>

    {% endfor %}

</div>


<!-- 하단 네비 -->
<nav class="bottom-nav">

    <a href="/" class="nav-item">
        <span class="nav-icon">⌂</span>
        홈
    </a>

    <a href="/add/" class="nav-item">
        <span class="nav-icon">▣</span>
        일정
    </a>

    <a href="/friends/" class="nav-item active">
        <span class="nav-icon">♟</span>
        친구
    </a>

    <a href="/settings/" class="nav-item">
        <span class="nav-icon">⚙</span>
        설정
    </a>

</nav>

</body>
</html>
